<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites - Your Energy</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body class="favorites-page">
    <!-- TODO: Implement header partial -->
    <load src="./partials/header.html" />

    <main>
      <section class="exercises-section">
        <div class="container exercises-container">
          <div class="exercises-top-bar">
            <h2 class="exercises-title">Favorites</h2>
          </div>

          <div class="main-layout-container">
            <div class="exercises-content-wrapper min-h-auto">
              <div class="exercises-grid-container" id="favorites-container">
                <ul class="exercises-cards-grid" id="favorites-list"></ul>
              </div>

              <div class="exercises-fallback is-hidden" id="favorites-empty">
                <p class="fallback-text">
                  It appears that you haven't added any exercises to your favorites
                  yet. To get started, you can add exercises that you like to your
                  favorites for easier access in the future.
                </p>
              </div>
            </div>

            <load src="./partials/quote-favorites.html" />
          </div>
        </div>
      </section>
    </main>

    <!-- TODO: Implement footer partial -->
    <load src="./partials/footer.html" />

    <!-- Modals -->
    <load src="./partials/modals/exercise-modal.html" />
    <load src="./partials/modals/rating-modal.html" />

    <!-- Modal -->
    <load src="./partials/scroll-up.html" />

    <script type="module" src="./js/main.ts"></script>
  </body>
</html>
