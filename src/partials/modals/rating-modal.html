<!-- 
  RATING MODAL (OPTIONAL FEATURE)
  ===============================
  
  Triggered by: Click on "Give a rating" button in exercise modal
  
  IMPORTANT: When this modal opens, exercise modal should close.
             When this modal closes, exercise modal should reopen.
  
  Form fields (all required):
  - Rating: Radio buttons (1-5 stars)
  - Email: Input with pattern validation
    Pattern: ^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$
  - Review: Textarea
  
  Submit behavior:
  - Validate all fields
  - Send PATCH request to API
  - On success: close modal, reopen exercise modal
  - On error: show error notification (iziToast)
  
  CLOSE MODAL:
  - Click on backdrop
  - Click on X button
  - Press ESC key
  
  API usage:
  import { addExerciseRating } from './js/api.js';
  
  try {
    await addExerciseRating(exerciseId, { rate: 5, email, review });
    // Success: close modal
  } catch (error) {
    // Show error notification
  }
-->
