<!--
  EXERCISE MODAL
  ==============

  Triggered by: click on any element with [data-modal-open="exercise"][data-exercise-id]
  (event delegation, see src/js/modal.ts — no direct wiring needed from the card grid).

  All text/data fields below are placeholders filled in by src/js/modal.ts.
-->

<div class="modal exercise-modal is-hidden" id="exercise-modal" aria-hidden="true">
  <div class="modal__backdrop" data-modal-backdrop></div>

  <div
    class="exercise-modal__content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="exercise-modal-title"
  >
    <button
      class="modal__close"
      type="button"
      aria-label="Close modal"
      data-modal-close
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M6 6L18 18M18 6L6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <div class="exercise-modal__media">
      <img
        class="exercise-modal__gif"
        data-field="gif"
        alt=""
      />
    </div>

    <div class="exercise-modal__body">
      <h3 class="exercise-modal__title" id="exercise-modal-title" data-field="name"></h3>

      <div class="exercise-modal__rating">
        <span class="exercise-modal__rating-value" data-field="rating-value"></span>
        <span class="exercise-modal__stars" data-field="stars"></span>
      </div>

      <div class="exercise-modal__divider"></div>

      <div class="exercise-modal__stats">
        <div class="exercise-modal__stat">
          <span class="exercise-modal__stat-label">Target</span>
          <span class="exercise-modal__stat-value" data-field="target"></span>
        </div>
        <div class="exercise-modal__stat">
          <span class="exercise-modal__stat-label">Body part</span>
          <span class="exercise-modal__stat-value" data-field="bodyPart"></span>
        </div>
        <div class="exercise-modal__stat">
          <span class="exercise-modal__stat-label">Equipment</span>
          <span class="exercise-modal__stat-value" data-field="equipment"></span>
        </div>
        <div class="exercise-modal__stat">
          <span class="exercise-modal__stat-label">Popularity</span>
          <span class="exercise-modal__stat-value" data-field="popularity"></span>
        </div>
        <div class="exercise-modal__stat">
          <span class="exercise-modal__stat-label">Burned calories</span>
          <span class="exercise-modal__stat-value" data-field="calories"></span>
        </div>
      </div>

      <div class="exercise-modal__divider"></div>

      <p class="exercise-modal__description" data-field="description"></p>

      <button
        class="exercise-modal__favorite-btn"
        type="button"
        aria-pressed="false"
        data-modal-favorite-btn
      >
        <span data-field="favorite-label">Add to favorites</span>
        <svg
          width="18"
          height="18"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
          data-field="favorite-icon-add"
        >
          <path
            d="M10 17.25l-1.18-1.06C4.4 12.36 1.5 9.75 1.5 6.6 1.5 4.05 3.49 2 6 2c1.4 0 2.74.66 3.6 1.7.86-1.04 2.2-1.7 3.6-1.7 2.51 0 4.5 2.05 4.5 4.6 0 3.15-2.9 5.76-7.32 9.6L10 17.25z"
          />
        </svg>
        <svg
          width="18"
          height="18"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          data-field="favorite-icon-remove"
        >
          <path
            d="M2.5 5h15M7.5 5V3.33c0-.46.37-.83.83-.83h3.34c.46 0 .83.37.83.83V5m2.5 0-.6 10.28a1.67 1.67 0 0 1-1.67 1.55H7.44a1.67 1.67 0 0 1-1.67-1.55L5.17 5h9.66zM8.33 8.33v5M11.67 8.33v5"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
